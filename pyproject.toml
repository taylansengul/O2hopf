[project]
name = "o2sym-prototype"
version = "0.4.1"
description = "Prototype O(2)-Hopf normal-form coefficient calculator"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
app = ["streamlit"]
test = ["pytest", "sympy"]
paper = ["matplotlib"]
dev = ["streamlit", "pytest", "matplotlib", "sympy"]

[tool.pytest.ini_options]
pythonpath = ["."]
